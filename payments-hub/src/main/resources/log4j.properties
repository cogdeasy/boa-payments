# boa-common AuditLogger writes the SOX audit trail through log4j 1.2 (category AUDIT).
log4j.rootLogger=WARN, console
log4j.logger.AUDIT=INFO, audit
log4j.additivity.AUDIT=false

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [payments-hub] %c : %m%n

log4j.appender.audit=org.apache.log4j.ConsoleAppender
log4j.appender.audit.layout=org.apache.log4j.PatternLayout
log4j.appender.audit.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS}  INFO [payments-hub,audit] AUDIT : %m%n
