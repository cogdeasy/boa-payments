server:
  port: 8081

spring:
  application:
    name: payments-hub
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: America/New_York
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jackson:
    default-property-inclusion: non_null

core:
  banking:
    base-url: http://localhost:8080/api/v1
    username: ops.batch
    password: Ops#Batch1
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    max-attempts: 3
    backoff-ms: 250
    suspense-account: "307000555010"

nb:
  billpay:
    release-cron: "0 */5 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [payments-hub,%X{rid:-}] %t %logger{36} : %m%n"
  level:
    com.northbridge: INFO
    http: INFO
